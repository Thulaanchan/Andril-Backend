openapi: 3.0.3
info:
  title: ANDRIL Shared Groups
  version: 1.0.0
  description: Requires explicit persistence and module activation, a valid Supabase bearer token and confirmed
    identity. Canonical scope pairs are learning/Classroom (1), hobbies/Club (2), and social/Zone (3).
    Deployments with persistence disabled leave the routes unmapped.
security:
  - supabaseBearer: []
paths:
  /api/v1/groups:
    post:
      operationId: createGroup
      description: Create a Classroom, Club or Zone with initial owner membership and scoped capabilities.
        Discoverability is required. Visibility defaults to private.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroup"
      responses:
        "201":
          description: The authorized operation completed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              description: URI of the committed Group details resource.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetails"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/groups/discover:
    get:
      operationId: discoverGroups
      description: Search eligible Groups in one module. An empty list is a successful authorized result.
      parameters:
        - name: module
          in: query
          required: true
          schema:
            type: string
            enum:
              - learning
              - hobbies
              - social
        - name: groupKind
          in: query
          required: true
          schema:
            type: integer
            format: int32
            enum:
              - 1
              - 2
              - 3
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: maximum
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: The authorized operation completed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: "#/components/schemas/GroupCard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getGroupDetails
      description: Read only authorized Group settings.
      parameters:
        - name: module
          in: query
          required: true
          schema:
            type: string
            enum:
              - learning
              - hobbies
              - social
        - name: groupKind
          in: query
          required: true
          schema:
            type: integer
            format: int32
            enum:
              - 1
              - 2
              - 3
      responses:
        "200":
          description: The authorized operation completed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetails"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/groups/{groupId}/configuration:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateGroupConfiguration
      description: A current authorized host updates settings using the current revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroup"
      responses:
        "200":
          description: The authorized operation completed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetails"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/groups/{groupId}/participation/me:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getOwnGroupParticipation
      description: Read only the caller's verified participation state.
      parameters:
        - name: module
          in: query
          required: true
          schema:
            type: string
            enum:
              - learning
              - hobbies
              - social
        - name: groupKind
          in: query
          required: true
          schema:
            type: integer
            format: int32
            enum:
              - 1
              - 2
              - 3
      responses:
        "200":
          description: The authorized operation completed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnParticipation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/groups/{groupId}/join-requests:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: requestGroupMembership
      description: Submit an outstanding request for the verified caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Scope"
      responses:
        "200":
          description: The authorized operation completed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteOwnJoinRequest
      description: Cancel the verified caller's outstanding request. This alias requires a JSON body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Scope"
      responses:
        "200":
          description: The authorized operation completed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/groups/{groupId}/join-requests/cancel:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: cancelOwnJoinRequest
      description: Cancel the verified caller's outstanding request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Scope"
      responses:
        "200":
          description: The authorized operation completed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/groups/{groupId}/admissions:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listPendingGroupAdmissions
      description: An authorized host reads opaque pending request handles and submission timestamps.
      parameters:
        - name: module
          in: query
          required: true
          schema:
            type: string
            enum:
              - learning
              - hobbies
              - social
        - name: groupKind
          in: query
          required: true
          schema:
            type: integer
            format: int32
            enum:
              - 1
              - 2
              - 3
        - name: maximum
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: The authorized operation completed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: "#/components/schemas/HostRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: decideGroupAdmission
      description: An authorized host resolves a pending request. Prefer the opaque request ID. The existing
        applicantProfileId input remains accepted when authorized.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Admission"
      responses:
        "200":
          description: The authorized operation completed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/groups/{groupId}/leave:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: leaveGroup
      description: Voluntarily leave as a current member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Scope"
      responses:
        "200":
          description: The authorized operation completed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/groups/{groupId}/members/me:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteOwnGroupMembership
      description: Voluntarily leave as a current member. This alias requires a JSON body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Scope"
      responses:
        "200":
          description: The authorized operation completed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/groups/safety/{module}/blocks/{profileId}:
    parameters:
      - name: module
        in: path
        required: true
        schema:
          type: string
          enum:
            - learning
            - hobbies
      - name: profileId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: writeGroupModuleBlock
      description: Set or clear the confirmed caller's own directional block in the named module.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Authority"
      responses:
        "204":
          description: The authorized operation completed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/groups/safety/{module}/restrictions/{profileId}:
    parameters:
      - name: module
        in: path
        required: true
        schema:
          type: string
          enum:
            - learning
            - hobbies
      - name: profileId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: writeGroupModuleRestriction
      description: Set or clear a restriction with an explicit current administrative grant for the module.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Authority"
      responses:
        "204":
          description: The authorized operation completed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/groups/learning/educators/{profileId}:
    parameters:
      - name: profileId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setClassroomEducator
      description: A scoped Learning administrator sets or revokes educator capability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Authority"
      responses:
        "204":
          description: The authorized operation completed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    supabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    NoStore:
      description: Private response must not be stored.
      schema:
        type: string
        example: no-store
  schemas:
    Scope:
      type: object
      required:
        - module
        - groupKind
      additionalProperties: false
      properties:
        module:
          type: string
          enum:
            - learning
            - hobbies
            - social
        groupKind:
          type: integer
          format: int32
          enum:
            - 1
            - 2
            - 3
    CreateGroup:
      type: object
      required:
        - module
        - groupKind
        - name
        - isDiscoverable
      additionalProperties: false
      properties:
        module:
          type: string
          enum:
            - learning
            - hobbies
            - social
        groupKind:
          type: integer
          format: int32
          enum:
            - 1
            - 2
            - 3
        name:
          type: string
          minLength: 1
          maxLength: 160
        isDiscoverable:
          type: boolean
        description:
          type: string
          nullable: true
          maxLength: 2000
        visibility:
          type: string
          enum:
            - private
            - public
          default: private
      example:
        module: hobbies
        groupKind: 2
        name: Weekend Photography
        isDiscoverable: true
        visibility: public
    UpdateGroup:
      type: object
      required:
        - module
        - groupKind
        - name
        - isDiscoverable
        - visibility
        - expectedRevision
      additionalProperties: false
      properties:
        module:
          type: string
          enum:
            - learning
            - hobbies
            - social
        groupKind:
          type: integer
          format: int32
          enum:
            - 1
            - 2
            - 3
        name:
          type: string
          minLength: 1
          maxLength: 160
        isDiscoverable:
          type: boolean
        description:
          type: string
          nullable: true
          maxLength: 2000
        visibility:
          type: string
          enum:
            - private
            - public
        expectedRevision:
          type: integer
          format: int64
          minimum: 1
    GroupDetails:
      type: object
      required:
        - id
        - module
        - groupKind
        - name
        - isDiscoverable
        - description
        - visibility
        - revision
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        module:
          type: string
          enum:
            - learning
            - hobbies
            - social
        groupKind:
          type: integer
          format: int32
          enum:
            - 1
            - 2
            - 3
        name:
          type: string
          minLength: 1
          maxLength: 160
        isDiscoverable:
          type: boolean
        description:
          type: string
          nullable: true
          maxLength: 2000
        visibility:
          type: string
          enum:
            - private
            - public
        revision:
          type: integer
          format: int64
          minimum: 1
    GroupCard:
      type: object
      required:
        - id
        - module
        - groupKind
        - name
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        module:
          type: string
          enum:
            - learning
            - hobbies
            - social
        groupKind:
          type: integer
          format: int32
          enum:
            - 1
            - 2
            - 3
        name:
          type: string
          minLength: 1
          maxLength: 160
    OwnParticipation:
      type: object
      required:
        - groupId
        - module
        - groupKind
        - state
      additionalProperties: false
      properties:
        groupId:
          type: string
          format: uuid
        module:
          type: string
          enum:
            - learning
            - hobbies
            - social
        groupKind:
          type: integer
          format: int32
          enum:
            - 1
            - 2
            - 3
        state:
          type: integer
          enum:
            - 0
            - 1
            - 2
          description: 0 means no current participation, 1 means member, and 2 means outstanding join request.
    HostRequest:
      type: object
      required:
        - requestId
        - requestedAtUtc
      additionalProperties: false
      properties:
        requestId:
          type: string
          format: uuid
        requestedAtUtc:
          type: string
          format: date-time
    Admission:
      type: object
      required:
        - module
        - groupKind
        - approve
      additionalProperties: false
      properties:
        module:
          type: string
          enum:
            - learning
            - hobbies
            - social
        groupKind:
          type: integer
          format: int32
          enum:
            - 1
            - 2
            - 3
        requestId:
          type: string
          format: uuid
        applicantProfileId:
          type: string
          format: uuid
        approve:
          type: boolean
      oneOf:
        - required:
            - requestId
        - required:
            - applicantProfileId
    Authority:
      type: object
      required:
        - enabled
      additionalProperties: false
      properties:
        enabled:
          type: boolean
    MembershipOperation:
      type: object
      required:
        - success
        - membershipCreated
        - entityRemoved
      additionalProperties: false
      properties:
        success:
          type: boolean
        membershipCreated:
          type: boolean
        entityRemoved:
          type: boolean
    Problem:
      type: object
      properties:
        status:
          type: integer
        title:
          type: string
        code:
          type: string
          enum:
            - creation_quota
            - club_capacity
            - revision_conflict
            - participation_conflict
  responses:
    BadRequest:
      description: Invalid body, route identifiers, search, or incompatible module and Group kind.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Authentication is required.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
    Forbidden:
      description: The actor or target is unavailable in this scope or current permission is insufficient.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Creation quota, capacity, revision, or participation conflicts with current state.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: A JSON request body is required.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
    Unavailable:
      description: Identity or current database authority could not be verified.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
