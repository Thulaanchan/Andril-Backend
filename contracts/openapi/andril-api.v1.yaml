openapi: 3.0.3
info:
  title: ANDRIL Backend API (starter module selection)
  version: 0.7.0
  description: >-
    Supabase user bearer authentication is required by default. Health is public.
    Account initialization, self-read and language preferences are available.
    Private DOB/gender submission, age eligibility and Screen 09 Terms agreement
    and Privacy acknowledgment are available. Screen 10 supports one starter module
    with age checks and explicit Social opt-in. Later module activation, switching,
    deactivation and module-profile creation are not implemented here.
    Missing or invalid credentials receive 401 with a Bearer challenge and no token
    details; authenticated users denied by an authorization policy receive 403.
security:
  - supabaseBearer: []
components:
  schemas:
    StarterModuleSelection:
      type: object
      additionalProperties: false
      required: [module]
      properties:
        module:
          type: string
          enum: [learning, hobbies, social]
        socialOptIn:
          type: boolean
          nullable: true
          description: Must be explicitly true for social. Must be false, null or omitted for learning/hobbies. Never inferred from Terms or Privacy receipts.
    StarterModuleStatus:
      type: object
      required: [demographicsComplete, requiredPoliciesComplete, modules, membership, nextStep]
      properties:
        demographicsComplete:
          type: boolean
          description: Valid stored DOB and gender exist; no private values are returned.
        requiredPoliciesComplete:
          type: boolean
          description: Existing receipts match the currently configured Terms and Privacy versions.
        modules:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            required: [module, ageEligible, requiresSocialOptIn, canSelect]
            properties:
              module:
                type: string
                enum: [learning, hobbies, social]
              ageEligible:
                type: boolean
                description: Recalculated with current UTC date; learning/hobbies 16+, social 18+.
              requiresSocialOptIn:
                type: boolean
              canSelect:
                type: boolean
                description: Age and prerequisites permit first selection and no starter already exists. Social still needs explicit POST opt-in.
        membership:
          type: object
          nullable: true
          required: [module, activatedAtUtc, socialOptIn]
          properties:
            module:
              type: string
              enum: [learning, hobbies, social]
            activatedAtUtc:
              type: string
              format: date-time
            socialOptIn:
              type: boolean
              description: True only when a Social starter and its opt-in evidence were recorded together.
        nextStep:
          type: string
          enum: [complete_demographics, review_policies, age_ineligible, select_starter, starter_selected]
          description: Navigation hint only; not a module-access token, profile, identity link or claim of overall onboarding completion.
    PolicyDocument:
      type: object
      required: [version, url, language]
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 200
          description: Exact immutable version supplied by the document owner; never generated by the API.
        url:
          type: string
          format: uri
          description: Configured HTTPS location for this exact document version.
        language:
          type: string
          enum: [en]
    PolicyAcknowledgment:
      type: object
      additionalProperties: false
      required: [actions]
      properties:
        actions:
          type: array
          minItems: 2
          maxItems: 2
          description: Exactly one terms_agreed and one privacy_acknowledged action, only after explicit Screen 09 choices. No Community Guidelines checkbox.
          items:
            type: object
            additionalProperties: false
            required: [action, version]
            properties:
              action:
                type: string
                enum: [terms_agreed, privacy_acknowledged]
              version:
                type: string
                minLength: 1
                maxLength: 200
                description: Exact current version from GET status; no whitespace normalization.
    PolicyStatus:
      type: object
      required: [documents, termsAgreed, privacyAcknowledged, requiredActionsComplete, history]
      properties:
        documents:
          type: object
          required: [terms, privacy, communityGuidelines]
          properties:
            terms:
              $ref: '#/components/schemas/PolicyDocument'
            privacy:
              $ref: '#/components/schemas/PolicyDocument'
            communityGuidelines:
              $ref: '#/components/schemas/PolicyDocument'
        termsAgreed:
          type: boolean
        privacyAcknowledged:
          type: boolean
        requiredActionsComplete:
          type: boolean
          description: Both required actions exist for current configured versions. Feature 06 must read this again before continuing; not module activation or overall onboarding completion.
        history:
          type: array
          description: Only this authenticated account's receipts, including earlier versions.
          items:
            type: object
            required: [action, version, recordedAtUtc]
            properties:
              action:
                type: string
                enum: [terms_agreed, privacy_acknowledged]
              version:
                type: string
              recordedAtUtc:
                type: string
                format: date-time
                description: Server-assigned UTC timestamp; preserved on identical retries.
    AccountEligibilitySubmission:
      type: object
      additionalProperties: false
      required: [dateOfBirth, gender]
      properties:
        dateOfBirth:
          type: string
          format: date
          description: Valid ISO calendar date yyyy-MM-dd, no later than today's UTC date. The provider sentinel 0001-01-01 is unsupported.
        gender:
          type: string
          minLength: 1
          maxLength: 100
          description: Non-whitespace text without control characters; trimmed. Vocabulary pending review, not an approved enum.
    AccountEligibility:
      type: object
      additionalProperties: false
      required: [hasSubmission, evaluatedOnUtc, ageEligibility]
      properties:
        hasSubmission:
          type: boolean
          description: A demographics record exists; this is not onboarding completion.
        evaluatedOnUtc:
          type: string
          format: date
        ageEligibility:
          type: object
          additionalProperties: false
          required: [learning, hobbies, social]
          properties:
            learning:
              type: boolean
              description: Age at least 16.
            hobbies:
              type: boolean
              description: Age at least 16.
            social:
              type: boolean
              description: Age at least 18 only; not Social opt-in or activation authorization.
    LanguagePreference:
      type: object
      additionalProperties: false
      required: [language, isStored]
      properties:
        language:
          type: string
          enum: [en, ta, si]
        isStored:
          type: boolean
          description: False means English display fallback only; no preference was saved.
    LanguagePreferenceUpdate:
      type: object
      additionalProperties: false
      required: [language, mode]
      properties:
        language:
          type: string
          enum: [en, ta, si]
          description: Exact lowercase code; no implicit normalization.
        mode:
          type: string
          enum: [sync, settings]
          description: sync only inserts if absent; settings explicitly replaces the account value.
    Account:
      type: object
      additionalProperties: false
      required: [accountId, createdAtUtc, updatedAtUtc]
      properties:
        accountId:
          type: string
          format: uuid
          description: Private account identifier; never a module identity.
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
    AccountProblem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        traceId:
          type: string
  responses:
    StarterModuleOk:
      description: Owner-only starter status, without account IDs, module profile IDs, DOB, gender or private identity links.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StarterModuleStatus'
    StarterModuleProblem:
      description: Safe starter-selection error. No private records or database details disclosed.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AccountProblem'
    PolicyOk:
      description: Current configured documents and caller-owned policy status. No account or receipt is created by GET.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PolicyStatus'
    PolicyProblem:
      description: Safe policy error; no persistence, configuration or private record details disclosed.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AccountProblem'
    AccountEligibilityOk:
      description: Computed age eligibility only; never includes DOB, gender, raw age or account identifiers.
      headers:
        Cache-Control:
          schema:
            type: string
            example: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountEligibility'
    EligibilityInvalid:
      description: Invalid/missing DOB or gender, future DOB, oversized/control-character gender, or unknown property. No data changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AccountProblem'
    EligibilityAccountMissing:
      description: Initialize the authenticated account first; this operation never initializes an account.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AccountProblem'
    LanguagePreferenceOk:
      description: Authoritative stored account value, or a read-only English fallback with isStored false.
      headers:
        Cache-Control:
          schema:
            type: string
            example: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LanguagePreference'
    LanguagePreferenceInvalid:
      description: Missing/malformed body, missing/unsupported language or mode, or unknown JSON property. No preference changed.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/AccountProblem'
              - type: object
                properties:
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
    LanguageAccountMissing:
      description: Initialize the authenticated account first. No account or preference was created.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AccountProblem'
    AccountOk:
      description: The authenticated caller's account. Initialization always returns 200, including retries.
      headers:
        Cache-Control:
          schema:
            type: string
          description: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Account'
    Unauthorized:
      description: Missing or invalid user access token. Empty body; no validation details.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
    AccountUnavailable:
      description: Account persistence is unconfigured or unavailable. No connection/provider details returned.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AccountProblem'
  securitySchemes:
    supabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Supabase user access token from the configured project, audience authenticated.
        Signature, exact issuer/audience, expiry and nonempty UUID subject are validated.
        Requires role authenticated and is_anonymous false. API keys, service-role,
        anonymous-user and legacy HS256 tokens are not accepted. ES256 or RS256 must
        be explicitly configured. Authentication does not establish email verification,
        onboarding completion, account status or module eligibility.
paths:
  /api/v1/account/starter-module:
    get:
      operationId: getStarterModuleStatus
      summary: Read Screen 10 eligibility and the authenticated owner's existing starter
      description: >-
        Derives the account only from the verified token. Reads stored demographics,
        current policy receipts and membership, recalculating age in UTC. No writes.
        Returns no membership before selection; all canSelect flags are false after
        selection. All responses, including authentication failures, are no-store.
      responses:
        '200':
          $ref: '#/components/responses/StarterModuleOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/StarterModuleProblem'
        '503':
          $ref: '#/components/responses/StarterModuleProblem'
    post:
      operationId: selectStarterModule
      summary: Atomically choose exactly one starter; never switch or create module profiles
      description: >-
        Requires stored valid DOB/gender and receipts for current Terms and Privacy
        versions. Learning/hobbies require age 16+, social requires 18+ and explicit
        socialOptIn true. Age is recalculated server-side under database locks.
        Exactly one immutable starter membership per account. Identical retries
        preserve membership and opt-in timestamps, but revalidate current prerequisites
        and age. A different choice after selection receives 409. No additional module
        profiles or memberships are created. Unknown and duplicate JSON fields are
        rejected; client account IDs, eligibility, policy flags and timestamps are
        never trusted. All responses use Cache-Control no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StarterModuleSelection'
            examples:
              learning:
                value:
                  module: learning
              social:
                value:
                  module: social
                  socialOptIn: true
      responses:
        '200':
          $ref: '#/components/responses/StarterModuleOk'
        '400':
          description: Invalid/multiple module selection, missing Social opt-in, opt-in for a non-Social module, or unknown/duplicate fields. No writes; no-store.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AccountProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account is not age-eligible for the selected module. No private age/DOB details; no writes; no-store.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AccountProblem'
        '404':
          description: Account has not been initialized. No writes; no-store.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AccountProblem'
        '409':
          description: Missing demographics/current policy receipts, or a different starter already exists. No writes; no-store.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AccountProblem'
        '503':
          description: Required policy metadata or storage is unavailable. Fail closed; no-store.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AccountProblem'
  /api/v1/account/policies/status:
    get:
      operationId: getAccountPolicyStatus
      summary: Read Screen 09 documents and current policy completion for the authenticated owner
      description: >-
        All responses have Cache-Control no-store, including 401. Returns configured
        English Terms, Privacy and Community Guidelines links before acknowledgment.
        Metadata must exist for all three documents or this fails closed with 503.
        No client account selector is used. A new required version makes completion false.
      responses:
        '200':
          $ref: '#/components/responses/PolicyOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Authenticated account has not been initialized. Cache-Control no-store.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AccountProblem'
        '503':
          $ref: '#/components/responses/PolicyProblem'
  /api/v1/account/policies/acknowledgments:
    post:
      operationId: acknowledgeAccountPolicies
      summary: Atomically record the owner's explicit Screen 09 Terms and Privacy actions
      description: >-
        Never call from Screen 04 or preselect actions. Expose document links first.
        Exactly both required actions must be submitted against current configured
        versions. Unknown fields, client account IDs and timestamps are rejected.
        Identical retries return 200 without overwriting timestamps; historical versions
        remain. All responses have Cache-Control no-store. No Community Guidelines
        acceptance is required or recorded. Does not activate modules or complete onboarding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyAcknowledgment'
      responses:
        '200':
          $ref: '#/components/responses/PolicyOk'
        '400':
          description: Missing, duplicate, invalid action or version, or tampered fields. No writes; Cache-Control no-store.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AccountProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Account not initialized. No writes; Cache-Control no-store.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AccountProblem'
        '409':
          description: Submitted document version differs from current configuration. Retrieve and review current documents; no writes; Cache-Control no-store.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AccountProblem'
        '503':
          $ref: '#/components/responses/PolicyProblem'
  /api/v1/account/eligibility:
    get:
      operationId: getAccountAgeEligibility
      summary: Read the caller's computed module age eligibility
      description: >-
        Resolves the account from the verified Supabase identity. Missing demographics
        return hasSubmission false and all age-eligibility values false without writing.
        Uses current UTC calendar date on every read. A Feb 29 birth reaches its
        anniversary on Mar 1 in non-leap years. No DOB, gender or exact age is returned.
        Eligibility does not activate modules, collect consent or opt into Social.
      responses:
        '200':
          $ref: '#/components/responses/AccountEligibilityOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/EligibilityAccountMissing'
        '503':
          $ref: '#/components/responses/AccountUnavailable'
    put:
      operationId: submitAccountAgeEligibility
      summary: Submit or correct the caller's private DOB and gender for Screen 09
      description: >-
        Full idempotent submission. Both fields are required. Unknown properties,
        including account IDs, age and eligibility flags, are rejected. Under-16
        submissions are stored but all module age checks return false. No consent,
        Social opt-in, module activation or age-verification claim is implied.
        Identical submissions preserve timestamps; differing concurrent submissions
        use last database-applied write order. These are self-reported details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountEligibilitySubmission'
      responses:
        '200':
          $ref: '#/components/responses/AccountEligibilityOk'
        '400':
          $ref: '#/components/responses/EligibilityInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/EligibilityAccountMissing'
        '503':
          $ref: '#/components/responses/AccountUnavailable'
  /api/v1/account/preferences/language:
    get:
      operationId: getAccountLanguagePreference
      summary: Read the caller's account language preference
      description: >-
        Uses only the validated identity and server-resolved account. With no stored
        preference returns language en and isStored false without writing a default.
        Preserve the pre-login device choice for the first authenticated sync.
      responses:
        '200':
          $ref: '#/components/responses/LanguagePreferenceOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/LanguageAccountMissing'
        '503':
          $ref: '#/components/responses/AccountUnavailable'
    patch:
      operationId: updateAccountLanguagePreference
      summary: Sync a device choice once or explicitly change the account language
      description: >-
        sync inserts only if absent; existing account values always win over device
        sync. settings explicitly updates the account choice. Returns the authoritative
        stored value with isStored true. Repeated identical writes do not change timestamps.
        Concurrent first syncs have one winner. Concurrent differing settings updates use
        last database-applied write order. No client account ID is accepted in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanguagePreferenceUpdate'
            example:
              language: ta
              mode: sync
      responses:
        '200':
          $ref: '#/components/responses/LanguagePreferenceOk'
        '400':
          $ref: '#/components/responses/LanguagePreferenceInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/LanguageAccountMissing'
        '503':
          $ref: '#/components/responses/AccountUnavailable'
  /api/v1/account/initialize:
    post:
      operationId: initializeAccount
      summary: Idempotently initialize the authenticated caller's account
      description: >-
        No request body or identity parameters. The server derives identity only from
        the validated token. Client-supplied account IDs or Supabase subjects are never
        used. Repeated/concurrent calls return the same account with unchanged timestamps.
        This operation does not complete onboarding or activate any module.
      responses:
        '200':
          $ref: '#/components/responses/AccountOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AccountUnavailable'
  /api/v1/account/me:
    get:
      operationId: getMyAccount
      summary: Read the authenticated caller's account without creating it
      responses:
        '200':
          $ref: '#/components/responses/AccountOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No account exists for the authenticated caller; initialize it first.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AccountProblem'
        '503':
          $ref: '#/components/responses/AccountUnavailable'
  /health:
    get:
      security: []
      summary: Starter API health check
      operationId: healthCheck
      responses:
        '200':
          description: API process responds
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok
