openapi: 3.0.3
info:
  title: ANDRIL Backend API (Supabase authentication integration)
  version: 0.9.0
  description: >-
    Supabase user bearer authentication is required by default. Health is public.
    Account initialization, self-read and language preferences are available.
    Private DOB/gender submission, age eligibility and Screen 09 Terms agreement
    and Privacy acknowledgment are available. Screen 10 supports one starter module
    with age checks and explicit Social opt-in. Later module activation, switching,
    and deactivation are not implemented here. Owner-only private profile identity roots
    can be created and draft name/bio fields updated. Approved Social-first private-profile
    completion is derived from authorized persisted evidence and a valid Social display name.
    Approved Social starter setup can report overall onboarding completion. Photo processing
    retains its existing provider requirements. Module-home authorization remains blocked.
    Missing or invalid credentials receive 401 with a Bearer challenge and no token
    details; authenticated users denied by an authorization policy receive 403.
    All /api/v1/account and /api/v1/onboarding operations additionally require a matching confirmed email
    identity from the configured Supabase Auth user endpoint. Unconfirmed users receive
    403; unavailable/misconfigured identity verification receives 503. Per-subject local
    throttling receives 429 with Retry-After. All account responses are no-store.
    Flutter sends passwords, OTPs, Google credentials and recovery requests directly
    to Supabase through its official SDK; this API exposes no authentication proxies.
security:
  - supabaseBearer: []
components:
  schemas:
    OnboardingStatus:
      type: object
      additionalProperties: false
      required: [nextStep, progress, selectedModule, blockingDependency, onboardingComplete, moduleHomeAuthorized]
      properties:
        nextStep:
          type: string
          enum: [initialize_account, complete_demographics, age_ineligible, review_policies, select_starter, profile_setup]
          description: Derived on every read from server records. age_ineligible blocks progression. profile_setup remains the final step identifier even when Social setup is complete. Check onboardingComplete to distinguish those states.
        progress:
          type: object
          additionalProperties: false
          required: [identityVerified, accountInitialized, demographicsComplete, currentPoliciesAccepted, starterModuleSelected, privateProfileComplete]
          properties:
            identityVerified:
              type: boolean
              enum: [true]
            accountInitialized:
              type: boolean
            demographicsComplete:
              type: boolean
            currentPoliciesAccepted:
              type: boolean
            starterModuleSelected:
              type: boolean
            privateProfileComplete:
              type: boolean
              description: True only for approved Social-first completion from confirmed identity, initialized account, current Terms/Privacy, age 18+, explicit persisted opt-in, Social starter membership and an owner-scoped profile with a valid display name. Biography, photo, interests, preferences and questionnaire are optional. Learning and Hobbies remain false. This is never module-entry authorization.
        selectedModule:
          type: string
          nullable: true
          enum: [learning, hobbies, social, null]
          description: Own starter only; no module identity or profile identifiers.
        blockingDependency:
          type: string
          nullable: true
          enum: [private_profile_infrastructure, private_profile_missing, social_display_name, approved_profile_contract, null]
          description: Null for an approved complete Social private profile; social_display_name indicates a missing or invalid stored Social name. A null dependency does not grant module entry. Other modules retain their existing dependencies.
        onboardingComplete:
          type: boolean
          description: True only when the authenticated Social starter currently meets all approved setup requirements, including private-profile completion. Learning and Hobbies remain false. This flag does not grant module access.
        moduleHomeAuthorized:
          type: boolean
          enum: [false]
    StarterModuleSelection:
      type: object
      additionalProperties: false
      required: [module]
      properties:
        module:
          type: string
          enum: [learning, hobbies, social]
        socialOptIn:
          type: boolean
          nullable: true
          description: Must be explicitly true for social. Must be false, null or omitted for learning/hobbies. Never inferred from Terms or Privacy receipts.
    StarterModuleStatus:
      type: object
      required: [demographicsComplete, requiredPoliciesComplete, modules, membership, nextStep]
      properties:
        demographicsComplete:
          type: boolean
          description: Valid stored DOB and gender exist; no private values are returned.
        requiredPoliciesComplete:
          type: boolean
          description: Existing receipts match the currently configured Terms and Privacy versions.
        modules:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            required: [module, ageEligible, requiresSocialOptIn, canSelect]
            properties:
              module:
                type: string
                enum: [learning, hobbies, social]
              ageEligible:
                type: boolean
                description: Recalculated with current UTC date; learning/hobbies 16+, social 18+.
              requiresSocialOptIn:
                type: boolean
              canSelect:
                type: boolean
                description: Age and prerequisites permit first selection and no starter already exists. Social still needs explicit POST opt-in.
        membership:
          type: object
          nullable: true
          required: [module, activatedAtUtc, socialOptIn]
          properties:
            module:
              type: string
              enum: [learning, hobbies, social]
            activatedAtUtc:
              type: string
              format: date-time
            socialOptIn:
              type: boolean
              description: True only when a Social starter and its opt-in evidence were recorded together.
        nextStep:
          type: string
          enum: [complete_demographics, review_policies, age_ineligible, select_starter, starter_selected]
          description: Navigation hint only; not a module-access token, profile, identity link or claim of overall onboarding completion.
    PolicyDocument:
      type: object
      required: [version, url, language]
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 200
          description: Exact immutable version supplied by the document owner; never generated by the API.
        url:
          type: string
          format: uri
          description: Configured HTTPS location for this exact document version.
        language:
          type: string
          enum: [en]
    PolicyAcknowledgment:
      type: object
      additionalProperties: false
      required: [actions]
      properties:
        actions:
          type: array
          minItems: 2
          maxItems: 2
          description: Exactly one terms_agreed and one privacy_acknowledged action, only after explicit Screen 09 choices. No Community Guidelines checkbox.
          items:
            type: object
            additionalProperties: false
            required: [action, version]
            properties:
              action:
                type: string
                enum: [terms_agreed, privacy_acknowledged]
              version:
                type: string
                minLength: 1
                maxLength: 200
                description: Exact current version from GET status; no whitespace normalization.
    PolicyStatus:
      type: object
      required: [documents, termsAgreed, privacyAcknowledged, requiredActionsComplete, history]
      properties:
        documents:
          type: object
          required: [terms, privacy, communityGuidelines]
          properties:
            terms:
              $ref: '#/components/schemas/PolicyDocument'
            privacy:
              $ref: '#/components/schemas/PolicyDocument'
            communityGuidelines:
              $ref: '#/components/schemas/PolicyDocument'
        termsAgreed:
          type: boolean
        privacyAcknowledged:
          type: boolean
        requiredActionsComplete:
          type: boolean
          description: Both required actions exist for current configured versions. Feature 06 must read this again before continuing; not module activation or overall onboarding completion.
        history:
          type: array
          description: Only this authenticated account's receipts, including earlier versions.
          items:
            type: object
            required: [action, version, recordedAtUtc]
            properties:
              action:
                type: string
                enum: [terms_agreed, privacy_acknowledged]
              version:
                type: string
              recordedAtUtc:
                type: string
                format: date-time
                description: Server-assigned UTC timestamp; preserved on identical retries.
    AccountEligibilitySubmission:
      type: object
      additionalProperties: false
      required: [dateOfBirth, gender]
      properties:
        dateOfBirth:
          type: string
          format: date
          description: Valid ISO calendar date yyyy-MM-dd, no later than today's UTC date. The provider sentinel 0001-01-01 is unsupported.
        gender:
          type: string
          enum: [male, female, other, prefer_not_to_say]
          description: Exact case-sensitive canonical value. Whitespace and translated labels are rejected.
    AccountEligibility:
      type: object
      additionalProperties: false
      required: [hasSubmission, evaluatedOnUtc, ageEligibility]
      properties:
        hasSubmission:
          type: boolean
          description: A demographics record exists; this is not onboarding completion.
        evaluatedOnUtc:
          type: string
          format: date
        ageEligibility:
          type: object
          additionalProperties: false
          required: [learning, hobbies, social]
          properties:
            learning:
              type: boolean
              description: Age at least 16.
            hobbies:
              type: boolean
              description: Age at least 16.
            social:
              type: boolean
              description: Age at least 18 only; not Social opt-in or activation authorization.
    LanguagePreference:
      type: object
      additionalProperties: false
      required: [language, isStored]
      properties:
        language:
          type: string
          enum: [en, ta, si]
        isStored:
          type: boolean
          description: False means English display fallback only; no preference was saved.
    LanguagePreferenceUpdate:
      type: object
      additionalProperties: false
      required: [language, mode]
      properties:
        language:
          type: string
          enum: [en, ta, si]
          description: Exact lowercase code; no implicit normalization.
        mode:
          type: string
          enum: [sync, settings]
          description: sync only inserts if absent; settings explicitly replaces the account value.
    Account:
      type: object
      additionalProperties: false
      required: [accountId, createdAtUtc, updatedAtUtc]
      properties:
        accountId:
          type: string
          format: uuid
          description: Private account identifier; never a module identity.
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
    AccountProblem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        traceId:
          type: string
  responses:
    PrivatePhotoStatus:
      description: Owner-scoped photo storage state without object keys, hashes, or media URLs.
      headers:
        Cache-Control:
          schema: { type: string, enum: [no-store] }
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [uploadId, state, reason, isCurrent]
            properties:
              uploadId: { type: string, format: uuid }
              state: { type: string, enum: [PendingStorage, Stored, Failed] }
              reason: { type: string, enum: [None, StorageFailure, UploadAbandoned, IntegrityFailure] }
              isCurrent: { type: boolean }
    PrivateProfileOk:
      description: Owner-only private identity root; no completion approved.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [profileId, module, createdAtUtc, isComplete, blockingDependency]
            properties:
              profileId:
                type: string
                format: uuid
              module:
                type: string
                enum: [learning, hobbies, social]
              createdAtUtc:
                type: string
                format: date-time
              isComplete:
                type: boolean
                enum: [false]
              displayName:
                type: string
                nullable: true
              bio:
                type: string
                nullable: true
              visibility:
                type: string
                enum: [private]
              blockingDependency:
                type: string
                enum: [approved_profile_contract]
    EmailConfirmationRequired:
      description: Supabase user evidence does not establish a confirmed email for this subject. No account operation executes.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AccountProblem'
    AccountIdentityRateLimited:
      description: Per-subject API identity-check quota exceeded. Retry after the provided interval; empty response body.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Retry-After:
          schema:
            type: integer
          description: Seconds before retrying.
    StarterModuleOk:
      description: Owner-only starter status, without account IDs, module profile IDs, DOB, gender or private identity links.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StarterModuleStatus'
    StarterModuleProblem:
      description: Safe starter-selection error. No private records or database details disclosed.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AccountProblem'
    PolicyOk:
      description: Current configured documents and caller-owned policy status. No account or receipt is created by GET.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PolicyStatus'
    PolicyProblem:
      description: Safe policy error; no persistence, configuration or private record details disclosed.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AccountProblem'
    AccountEligibilityOk:
      description: Computed age eligibility only; never includes DOB, gender, raw age or account identifiers.
      headers:
        Cache-Control:
          schema:
            type: string
            example: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountEligibility'
    EligibilityInvalid:
      description: Invalid or missing DOB or gender, future DOB, noncanonical gender, or unknown property. No data changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AccountProblem'
    EligibilityAccountMissing:
      description: Initialize the authenticated account first; this operation never initializes an account.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AccountProblem'
    LanguagePreferenceOk:
      description: Authoritative stored account value, or a read-only English fallback with isStored false.
      headers:
        Cache-Control:
          schema:
            type: string
            example: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LanguagePreference'
    LanguagePreferenceInvalid:
      description: Missing/malformed body, missing/unsupported language or mode, or unknown JSON property. No preference changed.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/AccountProblem'
              - type: object
                properties:
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
    LanguageAccountMissing:
      description: Initialize the authenticated account first. No account or preference was created.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AccountProblem'
    AccountOk:
      description: The authenticated caller's account. Initialization always returns 200, including retries.
      headers:
        Cache-Control:
          schema:
            type: string
          description: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Account'
    Unauthorized:
      description: Missing or invalid user access token. Empty body; no validation details.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
    AccountUnavailable:
      description: Account persistence or Supabase identity verification is unconfigured or unavailable. No connection/provider details returned.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AccountProblem'
  securitySchemes:
    supabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Supabase user access token from the configured project, audience authenticated.
        Signature, exact issuer/audience, expiry and nonempty UUID subject are validated.
        Requires role authenticated and is_anonymous false. API keys, service-role,
        anonymous-user and legacy HS256 tokens are not accepted. ES256 or RS256 must
        be explicitly configured. JWT authentication alone does not establish email
        verification. Account routes additionally validate the matching Supabase user
        and top-level email_confirmed_at through the configured Auth endpoint. This
        does not establish onboarding completion, module eligibility or instant revocation.
paths:
  /api/v1/account/profiles/{module}/photos/{photoId}:
    parameters:
      - { name: module, in: path, required: true, schema: { type: string, enum: [learning, hobbies, social] } }
      - name: photoId
        in: path
        required: true
        description: Client request UUID on POST. Server upload UUID on GET.
        schema: { type: string, format: uuid }
    post:
      operationId: putPrivateProfilePhoto
      summary: Upload or replace a private profile photo
      description: >-
        Requires authenticated ownership and current module eligibility. Raw input is limited to
        5242880 bytes. Phase 02B will validate still JPEG or PNG, enforce dimensions and
        emit a metadata-stripped JPEG. Authorized operations return 503 in Phase 02A before
        reading the body or writing to Storage. When available, reuse the client request UUID
        for identical bytes. The server assigns a distinct upload UUID. Reusing the request UUID
        with different bytes or submitting an upload while another is active returns 409.
        The previous photo stays current until replacement finalization commits.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 5242880 }
      responses:
        '200': { $ref: '#/components/responses/PrivatePhotoStatus' }
        '400': { description: Invalid request or empty or invalid image. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Owner or module prerequisites denied. }
        '404': { description: Owned profile missing. }
        '409': { description: Scoped request conflict or active upload. }
        '413': { description: Upload exceeds 5242880 bytes. }
        '415': { description: Use application/octet-stream. }
        '429': { $ref: '#/components/responses/AccountIdentityRateLimited' }
        '503': { description: Photo processing unavailable in Phase 02A. Safe no-store ProblemDetails. }
    get:
      operationId: getPrivatePhotoStatus
      summary: Read status of a scoped upload without media or URLs
      responses:
        '200': { $ref: '#/components/responses/PrivatePhotoStatus' }
        '400': { description: Empty upload UUID. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Owner or module prerequisites denied. }
        '404': { description: Profile or scoped upload missing. }
        '429': { $ref: '#/components/responses/AccountIdentityRateLimited' }
        '503': { description: Photo status unavailable in Phase 02A. Safe no-store ProblemDetails. }
  /api/v1/account/profiles/{module}/photos/current:
    parameters:
      - { name: module, in: path, required: true, schema: { type: string, enum: [learning, hobbies, social] } }
    get:
      operationId: getCurrentPrivatePhotoStatus
      summary: Read the owner's current stored photo status
      responses:
        '200': { $ref: '#/components/responses/PrivatePhotoStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Owner or module prerequisites denied. }
        '404': { description: No current stored photo for the owned profile. }
        '429': { $ref: '#/components/responses/AccountIdentityRateLimited' }
        '503': { description: Photo status unavailable in Phase 02A. Safe no-store ProblemDetails. }
  /api/v1/account/profiles/{module}/photos/{uploadId}/content:
    parameters:
      - { name: module, in: path, required: true, schema: { type: string, enum: [learning, hobbies, social] } }
      - { name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCurrentPrivatePhotoContent
      summary: Read the owner's current stored photo as a private JPEG
      description: Pending, failed, superseded and out-of-scope content is unavailable.
      responses:
        '200':
          description: Verified current JPEG, at most 5242880 bytes.
          headers:
            Cache-Control:
              schema: { type: string, enum: ['private, no-store'] }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '400': { description: Empty upload UUID. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Owner or module prerequisites denied. }
        '404': { description: No current stored content for this scoped upload. }
        '429': { $ref: '#/components/responses/AccountIdentityRateLimited' }
        '503': { description: Photo content unavailable in Phase 02A. Safe no-store ProblemDetails. }
  /api/v1/account/profiles/{module}:
    put:
      operationId: updatePrivateProfileDraft
      summary: Replace owner-only draft fields; never completes a profile
      description: >-
        Requires existing profile and current owner prerequisites. Names are trimmed and
        ASCII-case-folded for module/name and account/name uniqueness. Exact retries
        are idempotent. Saving a draft does not complete the profile.
        Visibility is restricted to private.
        Unknown/duplicate fields are rejected. Maximum transport body is 16384 bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName, bio, visibility]
              properties:
                displayName:
                  type: string
                  description: >-
                    Trimmed name with 3 to 30 Unicode grapheme clusters. Allows Unicode
                    letters, decimal digits, attached combining marks, ordinary spaces,
                    underscores, and hyphens. Requires a letter or digit. Join controls
                    are allowed in supported Tamil and Sinhala consonant sequences.
                    Emoji, unsupported punctuation or symbols, directional controls,
                    other invalid invisible characters, NUL, and malformed Unicode are rejected.
                    Reserved names are andril, admin, administrator, moderator, support,
                    system, official, andriladmin, andrilmoderator, andrilsupport,
                    andrilofficial, and andrilteam. The entire name is compared after
                    ASCII case folding and removing ordinary spaces, underscores, and hyphens.
                bio:
                  type: string
                  nullable: true
                  description: >-
                    Optional content. Use null or an empty string for no bio. Accepts
                    up to 300 Unicode grapheme clusters, including multiline text and
                    emoji. Text is preserved as submitted. NUL and malformed Unicode are rejected.
                visibility: { type: string, enum: [private] }
      responses:
        '200':
          $ref: '#/components/responses/PrivateProfileOk'
        '400': { description: Invalid draft; no-store ProblemDetails. }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403': { description: Profile prerequisites denied; no-store ProblemDetails. }
        '404': { description: Account or profile missing; no-store ProblemDetails. }
        '409': { description: Display name unavailable; no-store ProblemDetails. }
        '413': { description: Transport size limit exceeded. }
        '429':
          $ref: '#/components/responses/AccountIdentityRateLimited'
        '503':
          $ref: '#/components/responses/AccountUnavailable'
    parameters:
      - name: module
        in: path
        required: true
        schema:
          type: string
          enum: [learning, hobbies, social]
    get:
      operationId: getPrivateModuleProfile
      summary: Read only the caller's selected eligible module identity root
      description: >-
        Requires fresh confirmed Supabase identity, owned account, selected membership,
        current demographics and policies, module age eligibility and Social opt-in.
        Never returns account IDs, other module identities or public media URLs.
      responses:
        '200':
          $ref: '#/components/responses/PrivateProfileOk'
        '400':
          description: Invalid canonical module. No-store ProblemDetails.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Unconfirmed identity or failed profile prerequisites. No-store ProblemDetails.
        '404':
          description: Caller account or eligible private profile missing. No-store ProblemDetails.
        '429':
          $ref: '#/components/responses/AccountIdentityRateLimited'
        '503':
          $ref: '#/components/responses/AccountUnavailable'
    post:
      operationId: createPrivateModuleProfile
      summary: Idempotently create only the selected module's private identity root
      description: >-
        Same prerequisites as GET. Send exactly an empty JSON object. All fields,
        including accountId, profileId, displayName and isComplete, are rejected.
        Retries preserve ID and timestamp. This does not complete onboarding.
        Use PUT for draft display name and bio. Completion rules remain PENDING;
        no PATCH profile API is available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        '200':
          $ref: '#/components/responses/PrivateProfileOk'
        '400':
          description: Invalid module, nonempty object or malformed JSON. No-store ProblemDetails.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Unconfirmed identity or failed profile prerequisites. No-store ProblemDetails.
        '404':
          description: Caller account missing. No-store ProblemDetails.
        '413':
          description: Request exceeds 1024 bytes. No-store.
        '429':
          $ref: '#/components/responses/AccountIdentityRateLimited'
        '503':
          $ref: '#/components/responses/AccountUnavailable'
  /api/v1/onboarding/status:
    get:
      operationId: getOnboardingStatus
      summary: Read private onboarding progress and resume step
      description: >-
        Requires a validated JWT and live matching confirmed Supabase identity.
        Read-only; never initializes accounts or accepts client completion flags.
        Sequence is account, demographics and age, current Terms/Privacy, starter,
        private profile. Approved Social-first privateProfileComplete may be true when all
        mandatory persisted evidence exists; optional biography, photo, interests, preferences
        and questionnaire do not gate it. A completed Social setup reports onboardingComplete
        true with nextStep profile_setup and blockingDependency null. Clients should show
        setup complete with entry unavailable. moduleHomeAuthorized remains false.
        Reuse this endpoint after login/restart and after successful progress writes.
        Progress booleans describe stored prerequisites independently, not cumulative authorization.
        Missing policy configuration returns 503 for initialized accounts. Uninitialized
        accounts return initialize_account without requiring the policy catalog.
        All responses including errors have Cache-Control no-store. Account and onboarding
        routes share the existing per-subject request limit. No request body or account ID.
      responses:
        '200':
          description: Server-derived status, including blocked age or missing profile infrastructure.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingStatus'
              examples:
                socialOnboardingComplete:
                  summary: Approved Social setup complete with module entry unavailable
                  value:
                    nextStep: profile_setup
                    progress:
                      identityVerified: true
                      accountInitialized: true
                      demographicsComplete: true
                      currentPoliciesAccepted: true
                      starterModuleSelected: true
                      privateProfileComplete: true
                    selectedModule: social
                    blockingDependency: null
                    onboardingComplete: true
                    moduleHomeAuthorized: false
        '401':
          description: Missing/invalid JWT or mismatched/revoked Supabase identity. Bearer challenge; no completion information.
        '403':
          description: Supabase identity is unconfirmed. ProblemDetails includes nextStep verify_identity, with no account progress.
        '429':
          description: Subject rate limit exceeded; Retry-After header provided.
        '503':
          description: Identity verification, policy configuration, account database or trusted status dependency unavailable. No completion information.
  /api/v1/account/starter-module:
    get:
      operationId: getStarterModuleStatus
      summary: Read Screen 10 eligibility and the authenticated owner's existing starter
      description: >-
        Derives the account only from the verified token. Reads stored demographics,
        current policy receipts and membership, recalculating age in UTC. No writes.
        Returns no membership before selection; all canSelect flags are false after
        selection. All responses, including authentication failures, are no-store.
      responses:
        '403':
          $ref: '#/components/responses/EmailConfirmationRequired'
        '429':
          $ref: '#/components/responses/AccountIdentityRateLimited'
        '200':
          $ref: '#/components/responses/StarterModuleOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/StarterModuleProblem'
        '503':
          $ref: '#/components/responses/StarterModuleProblem'
    post:
      operationId: selectStarterModule
      summary: Atomically choose exactly one starter; never switch or create module profiles
      description: >-
        Requires stored valid DOB/gender and receipts for current Terms and Privacy
        versions. Learning/hobbies require age 16+, social requires 18+ and explicit
        socialOptIn true. Age is recalculated server-side under database locks.
        Exactly one immutable starter membership per account. Identical retries
        preserve membership and opt-in timestamps, but revalidate current prerequisites
        and age. A different choice after selection receives 409. No additional module
        profiles or memberships are created. Unknown and duplicate JSON fields are
        rejected; client account IDs, eligibility, policy flags and timestamps are
        never trusted. All responses use Cache-Control no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StarterModuleSelection'
            examples:
              learning:
                value:
                  module: learning
              social:
                value:
                  module: social
                  socialOptIn: true
      responses:
        '429':
          $ref: '#/components/responses/AccountIdentityRateLimited'
        '200':
          $ref: '#/components/responses/StarterModuleOk'
        '400':
          description: Invalid/multiple module selection, missing Social opt-in, opt-in for a non-Social module, or unknown/duplicate fields. No writes; no-store.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AccountProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Supabase email is unconfirmed or account is not age-eligible for the selected module. No private age/DOB details; no writes; no-store.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AccountProblem'
        '404':
          description: Account has not been initialized. No writes; no-store.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AccountProblem'
        '409':
          description: Missing demographics/current policy receipts, or a different starter already exists. No writes; no-store.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AccountProblem'
        '503':
          description: Identity verification, required policy metadata or storage is unavailable. Fail closed; no-store.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AccountProblem'
  /api/v1/account/policies/status:
    get:
      operationId: getAccountPolicyStatus
      summary: Read Screen 09 documents and current policy completion for the authenticated owner
      description: >-
        All responses have Cache-Control no-store, including 401. Returns configured
        English Terms, Privacy and Community Guidelines links before acknowledgment.
        Metadata must exist for all three documents or this fails closed with 503.
        No client account selector is used. A new required version makes completion false.
      responses:
        '403':
          $ref: '#/components/responses/EmailConfirmationRequired'
        '429':
          $ref: '#/components/responses/AccountIdentityRateLimited'
        '200':
          $ref: '#/components/responses/PolicyOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Authenticated account has not been initialized. Cache-Control no-store.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AccountProblem'
        '503':
          $ref: '#/components/responses/PolicyProblem'
  /api/v1/account/policies/acknowledgments:
    post:
      operationId: acknowledgeAccountPolicies
      summary: Atomically record the owner's explicit Screen 09 Terms and Privacy actions
      description: >-
        Never call from Screen 04 or preselect actions. Expose document links first.
        Exactly both required actions must be submitted against current configured
        versions. Unknown fields, client account IDs and timestamps are rejected.
        Identical retries return 200 without overwriting timestamps; historical versions
        remain. All responses have Cache-Control no-store. No Community Guidelines
        acceptance is required or recorded. Does not activate modules or complete onboarding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyAcknowledgment'
      responses:
        '403':
          $ref: '#/components/responses/EmailConfirmationRequired'
        '429':
          $ref: '#/components/responses/AccountIdentityRateLimited'
        '200':
          $ref: '#/components/responses/PolicyOk'
        '400':
          description: Missing, duplicate, invalid action or version, or tampered fields. No writes; Cache-Control no-store.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AccountProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Account not initialized. No writes; Cache-Control no-store.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AccountProblem'
        '409':
          description: Submitted document version differs from current configuration. Retrieve and review current documents; no writes; Cache-Control no-store.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AccountProblem'
        '503':
          $ref: '#/components/responses/PolicyProblem'
  /api/v1/account/eligibility:
    get:
      operationId: getAccountAgeEligibility
      summary: Read the caller's computed module age eligibility
      description: >-
        Resolves the account from the verified Supabase identity. Missing demographics
        return hasSubmission false and all age-eligibility values false without writing.
        Uses current UTC calendar date on every read. A Feb 29 birth reaches its
        anniversary on Mar 1 in non-leap years. No DOB, gender or exact age is returned.
        Eligibility does not activate modules, collect consent or opt into Social.
      responses:
        '403':
          $ref: '#/components/responses/EmailConfirmationRequired'
        '429':
          $ref: '#/components/responses/AccountIdentityRateLimited'
        '200':
          $ref: '#/components/responses/AccountEligibilityOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/EligibilityAccountMissing'
        '503':
          $ref: '#/components/responses/AccountUnavailable'
    put:
      operationId: submitAccountAgeEligibility
      summary: Submit or correct the caller's private DOB and gender for Screen 09
      description: >-
        Full idempotent submission. Both fields are required. Unknown properties,
        including account IDs, age and eligibility flags, are rejected. Under-16
        submissions are stored but all module age checks return false. No consent,
        Social opt-in, module activation or age-verification claim is implied.
        Identical submissions preserve timestamps; differing concurrent submissions
        use last database-applied write order. These are self-reported details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountEligibilitySubmission'
      responses:
        '403':
          $ref: '#/components/responses/EmailConfirmationRequired'
        '429':
          $ref: '#/components/responses/AccountIdentityRateLimited'
        '200':
          $ref: '#/components/responses/AccountEligibilityOk'
        '400':
          $ref: '#/components/responses/EligibilityInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/EligibilityAccountMissing'
        '503':
          $ref: '#/components/responses/AccountUnavailable'
  /api/v1/account/preferences/language:
    get:
      operationId: getAccountLanguagePreference
      summary: Read the caller's account language preference
      description: >-
        Uses only the validated identity and server-resolved account. With no stored
        preference returns language en and isStored false without writing a default.
        Preserve the pre-login device choice for the first authenticated sync.
      responses:
        '403':
          $ref: '#/components/responses/EmailConfirmationRequired'
        '429':
          $ref: '#/components/responses/AccountIdentityRateLimited'
        '200':
          $ref: '#/components/responses/LanguagePreferenceOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/LanguageAccountMissing'
        '503':
          $ref: '#/components/responses/AccountUnavailable'
    patch:
      operationId: updateAccountLanguagePreference
      summary: Sync a device choice once or explicitly change the account language
      description: >-
        sync inserts only if absent; existing account values always win over device
        sync. settings explicitly updates the account choice. Returns the authoritative
        stored value with isStored true. Repeated identical writes do not change timestamps.
        Concurrent first syncs have one winner. Concurrent differing settings updates use
        last database-applied write order. No client account ID is accepted in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanguagePreferenceUpdate'
            example:
              language: ta
              mode: sync
      responses:
        '403':
          $ref: '#/components/responses/EmailConfirmationRequired'
        '429':
          $ref: '#/components/responses/AccountIdentityRateLimited'
        '200':
          $ref: '#/components/responses/LanguagePreferenceOk'
        '400':
          $ref: '#/components/responses/LanguagePreferenceInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/LanguageAccountMissing'
        '503':
          $ref: '#/components/responses/AccountUnavailable'
  /api/v1/account/initialize:
    post:
      operationId: initializeAccount
      summary: Idempotently initialize the authenticated caller's account
      description: >-
        No request body or identity parameters. The server derives identity only from
        the validated token. Client-supplied account IDs or Supabase subjects are never
        used. Repeated/concurrent calls return the same account with unchanged timestamps.
        This operation does not complete onboarding or activate any module.
      responses:
        '403':
          $ref: '#/components/responses/EmailConfirmationRequired'
        '429':
          $ref: '#/components/responses/AccountIdentityRateLimited'
        '200':
          $ref: '#/components/responses/AccountOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AccountUnavailable'
  /api/v1/account/me:
    get:
      operationId: getMyAccount
      summary: Read the authenticated caller's account without creating it
      responses:
        '403':
          $ref: '#/components/responses/EmailConfirmationRequired'
        '429':
          $ref: '#/components/responses/AccountIdentityRateLimited'
        '200':
          $ref: '#/components/responses/AccountOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No account exists for the authenticated caller; initialize it first.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AccountProblem'
        '503':
          $ref: '#/components/responses/AccountUnavailable'
  /health:
    get:
      security: []
      summary: Starter API health check
      operationId: healthCheck
      responses:
        '200':
          description: API process responds
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok
