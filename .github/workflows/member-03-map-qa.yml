name: ANDRIL Member-03 Map QA

on:
  push:
    branches: [Member-3]

permissions:
  contents: read

concurrency:
  group: member03-map-qa-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  map-postgres:
    if: github.ref == 'refs/heads/Member-3'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17.12-bookworm@sha256:837bed18782820fe967067cb5328b02b0d9992c1be9a37ee0c9c492cfc03af3b
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          # Synthetic service-only bootstrap secret; the test process never receives it.
          POSTGRES_PASSWORD: disposable_ci_postgres
        ports:
          - '127.0.0.1:55432:5432'
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Verify exact Member-3 ref
        run: if ($env:GITHUB_REF -cne 'refs/heads/Member-3') { throw 'Unauthorized ref.' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build and verify Map PostgreSQL partitions
        id: map-qa
        timeout-minutes: 44
        env:
          QA_SERVICE_ID: ${{ job.services.postgres.id }}
        run: ./scripts/ci/member-03-map-qa.ps1 -ServiceId $env:QA_SERVICE_ID
      - name: Upload sanitized Map verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: member03-map-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/member03-map-qa
          if-no-files-found: warn
          retention-days: 7
