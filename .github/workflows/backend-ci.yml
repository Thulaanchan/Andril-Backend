name: ANDRIL Backend CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Andril.slnx
      - name: Build
        run: dotnet build Andril.slnx --no-restore --configuration Release
      - name: Test (scaffolds have no cases until implemented)
        run: dotnet test Andril.slnx --no-build --configuration Release --verbosity normal
